<!doctype html>
<!-- `/` picks the visitor's language from navigator.languages (Chinese, Japanese,
     English; any other language opens English). Without JavaScript the meta
     refresh opens the default locale (zh-cn). Kept in public/ so the sitemap
     lists only the localized pages. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project-Shinkirou</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://project-shinkirou.github.io/zh-cn/" />
    <link rel="alternate" hreflang="zh-CN" href="https://project-shinkirou.github.io/zh-cn/" />
    <link rel="alternate" hreflang="en" href="https://project-shinkirou.github.io/en/" />
    <link rel="alternate" hreflang="ja" href="https://project-shinkirou.github.io/ja/" />
    <script>
      (function () {
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        var target = 'en';
        for (var i = 0; i < langs.length; i++) {
          var tag = String(langs[i]).toLowerCase();
          if (tag.indexOf('zh') === 0) { target = 'zh-cn'; break; }
          if (tag.indexOf('ja') === 0) { target = 'ja'; break; }
          if (tag.indexOf('en') === 0) { target = 'en'; break; }
        }
        location.replace('/' + target + '/' + location.search + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/zh-cn/" />
  </head>
  <body>
    <ul>
      <li><a href="/zh-cn/" hreflang="zh-CN" lang="zh-CN">简体中文</a></li>
      <li><a href="/en/" hreflang="en" lang="en">English</a></li>
      <li><a href="/ja/" hreflang="ja" lang="ja">日本語</a></li>
    </ul>
  </body>
</html>
